<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AERA Beauty Studio — Bengaluru Hair, Skin &amp; Bridal Salon</title>
    <meta
      name="description"
      content="A calm daylight beauty salon in Indiranagar, Bengaluru offering precision haircuts, ammonia-free hair colour, lymphatic facials, and bridal hair &amp; makeup."
    />
    <meta name="theme-color" content="#FCFAFA" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--app-head-->
  </head>
  <body class="bg-[#FCFAFA] text-[#2A2028] antialiased selection:bg-[#DDBBC7]/55 selection:text-[#2A2028]">
    <dialog id="aera-entrance" aria-label="AERA Beauty Studio entrance sequence">
      <div class="aera-entrance-frame" data-entrance-facade aria-hidden="true">
        <div class="aera-entrance-facade"></div>
        <div class="aera-entrance-leaf aera-entrance-leaf-left"></div>
        <div class="aera-entrance-leaf aera-entrance-leaf-right"></div>
        <div class="aera-entrance-crest">
          <span><!--entrance-brand-->AERA<!--/entrance-brand--></span>
          <small><!--entrance-subline-->Hair · Skin · Beauty<!--/entrance-subline--></small>
        </div>
      </div>
      <button type="button" autofocus>Skip Entrance →</button>
    </dialog>
    <script>
      (() => {
        const door = document.getElementById('aera-entrance');
        const skip = door.querySelector('button');
        const facade = door.querySelector('[data-entrance-facade]');
        // The first prerender carries its surface. Warm the texture for SPA arrivals and replays.
        let texture;
        function warmTexture() {
          if (texture || facade.style.getPropertyValue('--aera-facade-image')) return;
          texture = new Image();
          texture.src = '/media/doors-closed-480.avif';
        }
        window.addEventListener('load', warmTexture, { once: true });
        const reduced = matchMedia('(prefers-reduced-motion: reduce)');
        const key = 'aera_entrance_seen';
        let seen = false;
        let deadline;
        let opener;
        try { seen = sessionStorage.getItem(key) === '1'; } catch {}
        const changed = () => window.dispatchEvent(new Event('aera-entrance-change'));
        function close() {
          if (!door.open) return;
          clearTimeout(deadline);
          door.close();
          const bounds = opener?.getBoundingClientRect();
          if (bounds && bounds.bottom > 0 && bounds.top < innerHeight && bounds.width) {
            opener.focus({ preventScroll: true });
          } else {
            document.getElementById('main-content')?.focus({ preventScroll: true });
          }
          opener = undefined;
          changed();
        }
        function open(replay = false) {
          if (door.open || reduced.matches || (!replay && seen)) return;
          if (getComputedStyle(door).getPropertyValue('--aera-entrance-ready').trim() !== '1') return;
          if ([...document.querySelectorAll('[data-entrance-image]')].some(img =>
            img.complete && img.currentSrc && !img.naturalWidth
          )) return;
          opener = document.activeElement === document.body ? undefined : document.activeElement;
          if (texture?.complete && texture.naturalWidth) {
            facade.style.setProperty('--aera-facade-image', `url("${texture.src}")`);
          }
          try { door.showModal(); } catch { return; }
          seen = true;
          try { sessionStorage.setItem(key, '1'); } catch {}
          deadline = setTimeout(close, 2540);
          skip.focus({ preventScroll: true });
          changed();
        }
        skip.addEventListener('click', close);
        door.addEventListener('cancel', event => {
          event.preventDefault();
          close();
        });
        door.addEventListener('animationend', event => {
          if (event.target === door) close();
        });
        door.addEventListener('keydown', event => {
          if (event.key === 'Tab') {
            event.preventDefault();
            skip.focus();
          }
        });
        reduced.addEventListener('change', event => { if (event.matches) close(); });
        window.addEventListener('error', event => {
          if (event.target instanceof HTMLScriptElement ||
              event.target instanceof HTMLLinkElement ||
              event.target?.matches?.('[data-entrance-image]')) close();
        }, true);
        window.aeraEntrance = { open, close, isOpen: () => door.open };
        if (location.pathname === '/' || location.pathname === '/index.html') open();
      })();
    </script>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
