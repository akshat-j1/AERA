<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AERA Beauty Studio — Bengaluru Hair, Skin &amp; Bridal Salon</title>
    <meta
      name="description"
      content="A calm daylight beauty salon in Indiranagar, Bengaluru offering precision haircuts, ammonia-free hair colour, lymphatic facials, and bridal hair &amp; makeup."
    />
    <meta name="theme-color" content="#FCFAF7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var isHome = location.pathname === '/' || location.pathname === '/index.html';
          var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var seen = sessionStorage.getItem('aera_entrance_seen') === '1';
          if (isHome && !reduced && !seen) {
            document.documentElement.setAttribute('data-aera-entrance', 'pending');
          }
        } catch (e) {}
      })();
    </script>
    <!--app-head-->
  </head>
  <body class="bg-[#FCFAF7] text-[#2C221E] antialiased selection:bg-[#DEB0A3]/40 selection:text-[#2C221E]">
    <!-- Pre-hydration instant closed-door cover (removed seamlessly once React mounts 3D doors) -->
    <div id="aera-pre-entrance" aria-hidden="true">
      <img src="/media/doors-closed-960.webp" alt="" aria-hidden="true" />
      <div class="aera-pre-crest">
        <span>A E R A</span>
        <small>Hair · Skin · Bridal</small>
      </div>
    </div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
