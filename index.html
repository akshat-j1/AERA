<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AERA Beauty Studio — Bengaluru Hair, Skin &amp; Bridal Salon</title>
    <meta
      name="description"
      content="A calm daylight beauty salon in Indiranagar, Bengaluru offering precision haircuts, ammonia-free hair colour, lymphatic facials, and bridal hair &amp; makeup."
    />
    <meta name="theme-color" content="#FAF8F7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var isHome = location.pathname === '/' || location.pathname === '/index.html';
          var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var seen = sessionStorage.getItem('aera_entrance_seen') === '1';
          if (isHome && !reduced && !seen) {
            document.documentElement.setAttribute('data-aera-entrance', 'pending');
          }
        } catch (e) {}
      })();
    </script>
    <!--app-head-->
  </head>
  <body class="bg-[#FAF8F7] text-[#2A2128] antialiased selection:bg-[#D8ADB6]/45 selection:text-[#2A2128]">
    <!-- Pre-hydration closed double salon entrance cover (aligned identically to React 3D doors) -->
    <div id="aera-pre-entrance" aria-hidden="true">
      <div class="aera-pre-facade">
        <div class="aera-pre-doors">
          <div class="aera-pre-leaf"></div>
          <div class="aera-pre-leaf"></div>
        </div>
        <div class="aera-pre-crest">
          <span>AERA</span>
          <small>Hair · Skin · Beauty</small>
        </div>
      </div>
    </div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
